    <!-- Bart-Adern -->
    <g stroke="#4f46e5" stroke-width="7" stroke-linecap="round">
      <line x1="-8" y1="-150" x2="-110" y2="-82"/>
      <line x1="-8" y1="-50" x2="-94" y2="18"/>
      <line x1="-8" y1="50" x2="-78" y2="118"/>
      <line x1="-8" y1="150" x2="-62" y2="218"/>
    </g>
  </g>
</svg>
