  <circle cx="512" cy="512" r="360" fill="#4f46e5"/>
  <!-- Feder: Bart links breit, Fahne rechts schmal -->
  <g transform="translate(542,492) rotate(18)">
    <path d="M 10,320
             C -190,180 -160,-100 -95,-240
             C -75,-300 -60,-330 -40,-330
             C 0,-300 20,-220 45,-100
